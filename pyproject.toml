[project]
name = "browsing-analyzer"
version = "1.0.0"
description = "AI system to analyze browsing history, correlate with RAM usage, and generate actionable insights"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "typer>=0.12.0",
    "structlog>=24.1.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "psutil>=5.9.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
]

[project.scripts]
browsing-analyzer = "browsing_analyzer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browsing_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
