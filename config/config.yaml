# Browsing Analyzer - Main Configuration
# Values mirror the notebook pipeline in notebooks/guvi-final.ipynb.

# The notebook is the single source of truth for the domain -> category
# mapping; it is parsed at runtime and cached here.
notebook_path: notebooks/guvi-final.ipynb
domain_categories_yaml: config/domain_category_map.yaml

data:
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: data/models
  browser_history_file: browsing_history_last5days.csv
  ram_log_file: ram_log_last5days.csv
  browser_history_output: browsing_history_last5days.csv
  ram_log_output: ram_log_last5days.csv
  processed_history_file: final_browsing_history.csv
  processed_ram_log_file: final_ram_log.csv
  domain_category_map_file: domain_category_map.csv
  merged_data_file: merged_data.csv
  session_summary_file: session_summary.csv
  session_features_file: session_features.csv
  category_ram_stats_file: category_ram_stats.csv
  cluster_viz_file: cluster_viz.csv
  lstm_confusion_file: lstm_confusion.csv
  sequences_file: lstm_sequences.npz
  metrics_file: pipeline_metrics.json
  recommendations_file: recommendations.json
  model_output_file: lstm_model.pt
  model_metadata_file: lstm_metadata.json
  lstm_result_file: lstm_result.pkl
  cluster_model_file: cluster_model.pkl

sessionization:
  inactivity_threshold_minutes: 15

clustering:
  n_clusters: 2
  random_state: 42
  features:
    - session_duration_minutes
    - page_count
    - unique_domains
    - unique_categories
    - domain_switches
    - category_switches
    - avg_time_per_page_seconds
    - mean_used_mb
    - peak_used_mb
    - mean_usage_percent
    - peak_usage_percent
    - session_start_hour
    - session_start_dayofweek

model:
  type: lstm
  sequence_length: 5
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.5
  batch_size: 64
  epochs: 10
  learning_rate: 0.001
  test_size: 0.2
  random_state: 42

recommendations:
  late_night_hour: 22
  social_media_threshold: 0.45
  ram_spike_threshold_mb: 500
  category_ram_threshold_mb: 300
  high_switch_threshold: 6

output:
  images_dir: reports/images
  report_path: reports
  report_filename: Final_Project_Report.md

logging:
  level: INFO
  log_dir: logs
